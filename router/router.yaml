version: 1.1.0
complexity:
  files_threshold: 2
  cross_module: true
  public_behavior: true
skills:
- name: github-star-distill
  slot: shared
  scope: github
  invoke: user
  description_model: 用户给出 GitHub 仓库链接，表示想借鉴/参考/提炼/内化该项目的思路、设计或经验时触发
  description_human: 把 GitHub 明星项目内化为带适用边界的可复用经验/方法论，沉淀到记忆中枢
  trigger:
  - 借鉴
  - 参考 GitHub 项目
  - 内化 / 导入 / 投入
  - distill github repo
  forgot:
  - 只是运行某个 GitHub 仓库的单条命令(非提炼沉淀)
  - 需要自动安装仓库依赖或执行仓库内脚本(需人工批准)
  weight: 1.0
  status: active
- name: memory-hub-card-promotion
  slot: shared
  scope: memory-hub
  invoke: model
  description_model: 当需要把本次执行产生的经验/踩坑/结论回写记忆中枢，并完成 ingest 提升、INDEX 登记、跨库 git 提交时触发
  description_human: 经验卡回写→提升→登记→跨库提交 四步闭环，回连中枢保持一致
  trigger:
  - 回写中枢
  - 中枢草稿
  - 提升经验卡
  - 经验卡升级
  - 登记 INDEX
  - ingest
  forgot:
  - rule 类型
  - 直接改 rule
  - rule 卡
  - 自动执行中枢权威区外的脚本
  weight: 1.0
  status: active
- name: cross-repo-index-commit
  slot: shared
  scope: memory-hub
  invoke: user
  description_model: 当需要在中枢/其他独立 git 仓库执行 INDEX 登记、跨库改文件并 git 提交，而 Edit/Write 工具被限制在当前工作目录时触发
  description_human: 跨独立仓库用命令行等效(读文件+替换+git add/commit)维护 INDEX 并保持一致性
  trigger:
  - 跨仓库提交
  - 跨库登记
  - 跨库提交
  - 中枢 INDEX
  - INDEX 补登记
  - 独立仓库改文件
  - 跨库改文件
  forgot:
  - 工作目录内可 Edit
  - push 到远程
  - 改写全局 git config
  weight: 1.0
- name: superpowers
  slot: shared
  scope: methodology
  invoke: model
  description_model: 当需要开发方法论辅助时自动触发：头脑风暴、TDD、代码评审、调试策略、Git worktree 管理、分支管理等通用开发场景
  description_human: 13 个核心开发方法论技能合集：brainstorming/TDD/调试/计划/代码评审/Git worktree 等，通用开发场景自动命中
  trigger:
  - 头脑风暴
  - brainstorming
  - TDD
  - 测试驱动
  - 代码评审
  - code review
  - 调试
  - debugging
  - 写计划
  - planning
  - Git worktree
  - 分支管理
  forgot:
  - 纯知识问答
  - 不需要工具的简单解释
  weight: 0.8
  status: active
