# 路由表（唯一事实源）—— JIT 命中注入 + 反触发降权 + 复杂度路由
# 契约见 router/schema.yaml。skill 增删必须同步本表，否则路由撒谎（误命中比没有更糟）。

version: 1.0.0

# 复杂度路由判据：集中在路由一处判定，不复制到每个技能。
# 命中其一=复杂(启用重审查/双轴)，均否则轻量(单轴/免审查)。
complexity:
  files_threshold: 2      # 改动文件数 > 2 视为复杂
  cross_module: true      # 是否跨模块视为复杂
  public_behavior: true   # 是否涉公开行为(API/持久化/权限)视为复杂

skills:
  # ---- 示例：共用库（shared) ---- 单写法参考
  - name: github-star-distill
    slot: shared
    scope:
    invoke: user
    description_model: "用户给出 GitHub 仓库链接，表示想借鉴/参考/提炼/内化该项目的思路、设计或经验时触发"
    description_human: "把 GitHub 明星项目内化为带适用边界的可复用经验/方法论，沉淀到记忆中枢"
    trigger:
      - 借鉴
      - 参考 GitHub 项目
      - 内化 / 导入 / 投入
      - distill github repo
    forgot:
      - 只是运行某个 GitHub 仓库的单条命令(非提炼沉淀)
      - 需要自动安装仓库依赖或执行仓库内脚本(需人工批准)
    weight: 1.0

  # 示例再未来新增技能时在此追加登记；保持 slot/shared/dedicated 分布。