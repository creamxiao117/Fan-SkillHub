name: SkillHub Auto-Evolution

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml pytest pynacl

      # 中枢仓库 clone — step 内 bash 判断, 绕过 workflow 校验对 secrets.HUB_PAT 的限制
      - name: Clone AgentMemoryHub
        env:
          HUB_PAT: ${{ secrets.HUB_PAT }}
        run: |
          if [ -n "${HUB_PAT}" ]; then
            git clone --depth 1 "https://x-access-token:${HUB_PAT}@github.com/creamxiao117/AgentMemoryHub.git" .hub
            echo "AgentMemoryHub clone OK"
          else
            echo "HUB_PAT 为空, 跳过中枢 clone, 不执行 reconcile / push-to-hub / hub commit"
          fi

      - name: Migrate (回填 verification / slot / __reconcile_batch__ 缺失字段)
        run: python -m skillhub migrate
        continue-on-error: true

      # ① reconcile blueprint 卡 — apply, 每天 5 张
      - name: Reconcile blueprints (apply batch=5)
        run: |
          if [ -d .hub ]; then
            python -m skillhub reconcile \
              --hub-root .hub \
              --card-type blueprint \
              --apply \
              --batch-size 5 \
              --batch-index 0
          else
            echo "skip: no .hub"
          fi
        continue-on-error: true

      - name: Sync verification (双源: usage.jsonl 优先 → 回落中枢卡 frontmatter)
        run: |
          HUB_FLAG=""
          if [ -d .hub ]; then HUB_FLAG="--hub-root .hub"; fi
          python -m skillhub sync-verification $HUB_FLAG
        continue-on-error: true

      # ② promote-auto — 安全网: reuse_count≥3 + t1_record 有真实试用, 才会晋级
      - name: Promote auto (正式开启)
        run: python -m skillhub promote-auto --threshold 3
        continue-on-error: true

      # ③ SkillHub → 中枢反向同步 (SkillHub promote 到 active 写回中枢卡 status / reuse_count)
      - name: Push to hub (反向同步 dry-run 默认)
        run: |
          if [ -d .hub ]; then
            python -m skillhub push-to-hub --hub-root .hub
          else
            echo "skip: no .hub"
          fi
        continue-on-error: true

      - name: Hub git commit & push
        env:
          HUB_PAT: ${{ secrets.HUB_PAT }}
        run: |
          if [ ! -d .hub ]; then echo "skip: no .hub"; exit 0; fi
          cd .hub
          git config user.email "skillhub-bot@users.noreply.github.com"
          git config user.name "skillhub-bot"
          git remote set-url origin "https://x-access-token:${HUB_PAT}@github.com/creamxiao117/AgentMemoryHub.git"
          git add -A
          if git diff --cached --quiet; then
            echo "No hub changes, skip commit"
          else
            git commit -m "chore: sync from SkillHub auto-evolution"
            git push origin HEAD || echo "hub push skipped (branch protection?)"
          fi
        continue-on-error: true

      - name: Run tests
        run: python -m pytest -q
        continue-on-error: true

      # 自动提 PR 到 auto-evolution 分支 (SkillHub 侧改动)
      - name: Create PR if changed
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(auto-evolution): sync from daily run"
          title: "chore: SkillHub auto-evolution"
          branch: auto-evolution
          add-paths: |
            skills/**/*.yaml
            skills/**/*.md
            router/router.yaml
