name: SkillHub Auto-Evolution

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml pytest

      # 中枢仓库 clone (私有仓库需要 secrets.HUB_PAT; 无 secrets 时跳过, 不影响本地命令)
      - name: Clone AgentMemoryHub
        if: ${{ secrets.HUB_PAT != '' }}
        env:
          HUB_PAT: __HUB_PAT__
        run: |
          git clone https://x-access-token:${HUB_PAT}@github.com/creamxiao117/AgentMemoryHub.git .hub

      - name: Migrate (回填缺失字段)
        run: python -m skillhub migrate
        continue-on-error: true

      # ① reconcile blueprint 卡 — 开启 --apply, 每批 5 张
      #    每天最多 apply 5 张, 防止一次性生成过多
      - name: Reconcile blueprints (apply, batch=5)
        if: ${{ secrets.HUB_PAT != '' }}
        run: |
          python -m skillhub reconcile \
            --hub-root .hub \
            --card-type blueprint \
            --apply \
            --batch-size 5 \
            --batch-index 0
        continue-on-error: true

      - name: Sync verification (双源回填)
        run: |
          HUB_FLAG=""
          if [ -d .hub ]; then HUB_FLAG="--hub-root .hub"; fi
          python -m skillhub sync-verification $HUB_FLAG
        continue-on-error: true

      # ② promote-auto — 正式开启 (安全网: reuse_count>=3 + t1 非静态检查 才晋级)
      - name: Promote auto (正式)
        run: python -m skillhub promote-auto --threshold 3
        continue-on-error: true

      # ③ SkillHub -> 中枢 反向同步
      #    SkillHub 里 promote 到 active 的技能 → 回写中枢卡的 status/reuse_count/anti_trigger
      - name: Push to hub (反向同步)
        if: ${{ secrets.HUB_PAT != '' }}
        run: python -m skillhub push-to-hub --hub-root .hub
        continue-on-error: true

      - name: Hub git commit & push
        if: ${{ secrets.HUB_PAT != '' }}
        run: |
          cd .hub
          git config user.email "skillhub-bot@users.noreply.github.com"
          git config user.name "skillhub-bot"
          git add -A
          if git diff --cached --quiet; then
            echo "No hub changes, skip commit"
          else
            git commit -m "chore: sync from SkillHub auto-evolution"
            git push origin HEAD
          fi
        continue-on-error: true

      - name: Run tests
        run: python -m pytest -q
        continue-on-error: true

      - name: Create PR if changed
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: auto-evolution sync"
          title: "SkillHub auto-evolution"
          branch: auto-evolution
          add-paths: |
            skills/**/*.yaml
            skills/**/*.md
            router/router.yaml
