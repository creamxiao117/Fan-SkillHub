name: "SkillHub Auto-Evolution"

"on":
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Install deps"
        run: pip install pyyaml pytest pynacl

      # Step 1: 克隆中枢（私有仓库必须 token）。先清理残留再 clone（解决 "not an empty directory" 空转）；
      # 成功写 .hub_clone_ok 标志，后续所有依赖 .hub 的步骤仅在该标志存在时执行，避免误读残留目录。
      - name: "Clone AgentMemoryHub"
        env:
          HUB_PAT: ${{ secrets.HUB_PAT }}
        run: |
          rm -rf .hub .hub_clone_ok
          echo "HUB_PAT len=${#HUB_PAT}"
          if [ -z "${HUB_PAT}" ]; then echo "secrets.HUB_PAT 为空，跳过"; exit 0; fi
          if git clone --depth 1 "https://x-access-token:${HUB_PAT}@github.com/creamxiao117/AgentMemoryHub.git" .hub 2>clone.log; then
            touch .hub_clone_ok
            echo "clone OK"
          else
            echo "clone FAILED (见 clone.log)，本次不执行依赖 .hub 的步骤"
            cat clone.log
          fi
        continue-on-error: true

      - name: "Migrate — 回填 verification/slot/__reconcile_batch__ 缺失字段"
        run: python -m skillhub migrate
        continue-on-error: true

      # Step 2: reconcile blueprint 卡，每天 apply 5 张（仅当 clone 成功）
      - name: "Reconcile blueprints (apply batch=5)"
        run: |
          if [ -f .hub_clone_ok ]; then
            python -m skillhub reconcile \
              --hub-root .hub \
              --card-type blueprint \
              --apply \
              --batch-size 5 \
              --batch-index 0
          else
            echo "skip: .hub clone 失败/未执行，跳过 reconcile"
          fi
        continue-on-error: true

      # Step 3: sync-verification 双源回填（usage.jsonl 优先 → 中枢卡 reuse_count 回落）
      - name: "Sync verification — 双源回填 reuse_count"
        run: |
          HUB_FLAG=""
          if [ -f .hub_clone_ok ]; then HUB_FLAG="--hub-root .hub"; fi
          python -m skillhub sync-verification $HUB_FLAG
        continue-on-error: true

      # Step 4: promote-auto（正式开启；安全网：reuse_count>=3 且 t1_record 非静态 才晋级）
      - name: "Promote auto — 正式开启"
        run: python -m skillhub promote-auto --threshold 3
        continue-on-error: true

      # Step 5: SkillHub → 中枢反向同步（promote 到 active 的技能写回中枢卡 status / reuse_count）
      - name: "Push to hub — SkillHub→中枢反向同步"
        run: |
          if [ -f .hub_clone_ok ]; then
            python -m skillhub push-to-hub --hub-root .hub
          else
            echo "skip: .hub clone 失败/未执行，跳过 push"
          fi
        continue-on-error: true

      # Step 6: 中枢 git 提交 + push（反向同步真正落盘）
      - name: "Hub git commit & push"
        env:
          HUB_PAT: ${{ secrets.HUB_PAT }}
        run: |
          if [ ! -f .hub_clone_ok ]; then echo "skip: .hub clone 失败/未执行"; exit 0; fi
          cd .hub
          git config user.email "skillhub-bot@users.noreply.github.com"
          git config user.name "skillhub-bot"
          git remote set-url origin "https://x-access-token:${HUB_PAT}@github.com/creamxiao117/AgentMemoryHub.git"
          git add -A
          if git diff --cached --quiet; then
            echo "No hub changes — skip commit"
          else
            git commit -m "chore(sync): from SkillHub auto-evolution"
            git push origin HEAD || echo "hub push skipped (branch protection?)"
          fi
        continue-on-error: true

      - name: "Run tests — pytest"
        run: python -m pytest -q
        continue-on-error: true

      # 调试：看看当前工作树有什么改动，便于判断 PR 步骤为啥失败
      - name: "Debug: git diff status"
        run: |
          echo "--- git status --short ---"
          git status --short || true
          echo "--- files changed (skills/router): ---"
          (git diff --name-only HEAD; git ls-files --others --exclude-standard) | grep -E '^(skills|router)/' || echo "no changes in skills/ or router/"
        continue-on-error: true

      # 自动提 PR 到 auto-evolution 分支；无变更或失败不影响整个 run
      - name: "Create PR if SkillHub changed"
        uses: peter-evans/create-pull-request@v6
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(auto-evolution): daily sync"
          title: "chore: SkillHub auto-evolution"
          branch: auto-evolution
          add-paths: |
            skills/**/*.yaml
            skills/**/*.md
            router/router.yaml
